app:
  env: "testing"

logging:
  level: "warn"
  format: "text"
  add_source: false
  async_enabled: false
  async_queue_size: 256
  flush_timeout: "2s"

pipeline:
  workers: 1
  queue_size: 16
  batch_size: 1

storage:
  raw:
    backend: "memory"
  metadata:
    backend: "memory"
  vector:
    backend: "memory"
