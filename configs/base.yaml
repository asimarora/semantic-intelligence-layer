app:
  name: "semantic-intelligence-layer"

api:
  listen_addr: ":8080"
  read_timeout: "5s"
  write_timeout: "15s"
  idle_timeout: "30s"

logging:
  level: "info"
  format: "text"
  add_source: false
  async_enabled: true
  async_queue_size: 1024
  flush_timeout: "5s"

pipeline:
  workers: 2
  queue_size: 128
  batch_size: 1

ingest:
  source_type: "ras"
  input_path: "./testdata/ras"

sources:
  config_dir: "./configs/sources"
  enabled:
    - "radius"

channels:
  config_dir: "./configs/channels"
  enabled:
    - "chat"
    - "email"
    - "voice"
    - "messaging"
  webhook_base_path: "/v1/channels"
  request_body_limit_bytes: 1048576

storage:
  raw:
    backend: "file"
    path: "./var/raw"
  metadata:
    backend: "memory"
  vector:
    backend: "memory"

stream:
  backend: "disabled"
  stream_name: "SIL_EVENTS"
  storage: "file"
  raw_subject: "sil.raw.events"
  unified_subject: "sil.unified.events"
  index_subject: "sil.index.jobs"
  deadletter_subject: "sil.deadletter"
  consumer_prefix: "sil"
  ack_wait: "30s"
  max_deliveries: 5
  batch_size: 16
  max_ack_pending: 256
  connect_timeout: "5s"
  tls_enabled: false

cache:
  backend: "disabled"
