app:
  env: "development"

logging:
  level: "debug"
  format: "text"
  add_source: true

pipeline:
  workers: 2
  queue_size: 64
  batch_size: 1

sources:
  enabled:
    - "radius"
    - "access"

storage:
  raw:
    path: "./var/development/raw"
  metadata:
    backend: "file"
    path: "./var/development/metadata"
  vector:
    backend: "memory"
