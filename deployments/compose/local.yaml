name: sil-local-full

services:
  nats:
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - sil-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sil
      POSTGRES_USER: sil
      POSTGRES_PASSWORD: sil
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sil -d sil"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sil-net

  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sil-net

  ingestd:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE_NAME: ingestd
    environment:
      SIL_APP_ENV: development
      SIL_CONFIG_DIR: /app/configs
    depends_on:
      - nats
      - postgres
      - redis
    networks:
      - sil-net

  normalizerd:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE_NAME: normalizerd
    environment:
      SIL_APP_ENV: development
      SIL_CONFIG_DIR: /app/configs
    depends_on:
      - nats
      - postgres
      - redis
    networks:
      - sil-net

  apid:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE_NAME: apid
    environment:
      SIL_APP_ENV: development
      SIL_CONFIG_DIR: /app/configs
    depends_on:
      - nats
      - postgres
      - redis
    networks:
      - sil-net

volumes:
  nats-data:
  postgres-data:
  redis-data:

networks:
  sil-net:
    driver: bridge
