app:
  env: "qa"

logging:
  level: "info"
  format: "json"
  add_source: false

pipeline:
  workers: 8
  queue_size: 512
  batch_size: 16

storage:
  raw:
    backend: "file"
    path: "./var/qa/raw"
  metadata:
    backend: "postgres"
    addr: "postgres://sil-qa-metadata:5432"
    database: "sil"
  vector:
    backend: "milvus"
    addr: "milvus:19530"
    collection: "sil_events"

stream:
  backend: "jetstream"
  addr: "nats://nats:4222"
  subject: "sil.raw.events"

cache:
  backend: "redis"
  addr: "redis:6379"
